<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processeur</title>
  <link rel="stylesheet" href="Alimentation.css">
  <script src="Alimentation.js" defer></script>
  <link rel="icon" href="/Website Beta/Icones/Logo.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <video autoplay muted loop id="backgroundVideo">
    <source src="/Website Beta/VIDEOS/Background.mp4" type="video/mp4">
  </video>
</head>
<body class="bg-gray-100 font-sans">
  <div class="mx-auto" style="max-width: 1600px;">
    <div class="title-filters-container">
      <div class="p-4 border-b">
        <div class="alimentation-header">
          <h1 class="alimentation-title">Alimentation</h1>
          <span id="productCount" class="alimentation-count">(0)</span>
        </div>
        <div class="grid grid-cols-3 gap-4">
          <select id="Marques" class="border p-2 rounded">
            <option value="" disabled selected hidden>Marques</option>
            <option value="">Toutes les marques</option>
            <option value="AeroCool">AeroCool</option>
            <option value="Antec">Antec</option>
            <option value="ASUS">ASUS</option>
            <option value="BQ">be quiet !</option>
            <option value="CM">Cooler Master</option>
            <option value="Corsair">Corsair</option>
            <option value="MSI">MSI</option>
            <option value="SS">Seasonic</option>
          </select>
          <select id="Puissance"  class="border p-2">
            <option value="" disabled selected hidden>Puissance (en Watts)</option>
            <option value="">Toutes les puissances</option>
            <option value="300W">300W</option>
            <option value="350W">350W</option>
            <option value="400W">400W</option>
            <option value="450W">450W</option>
            <option value="500W">500W</option>
            <option value="550W">550W</option>
            <option value="650W">650W</option>
            <option value="750W">750W</option>
            <option value="850W">850W</option>
            <option value="1000W">1000W</option>
            <option value="1200W">1200W</option>
            <option value="1250W">1250W</option>
            <option value="1300W">1300W</option>
            <option value="1500W">1500W</option>
            <option value="1600W">1600W</option>
            <option value="2200W">2200W</option>
          </select>
          <select id="Normes" class="border p-2 rounded">
            <option value="" disabled selected hidden>Normes 80 PLUS</option>
            <option value="">Toutes les normes</option>
            <option value="Bronze">80 PLUS Bronze</option>
            <option value="Silver">80 PLUS Silver</option>
            <option value="Gold">80 PLUS Gold</option>
            <option value="Platinum">80 PLUS Platinum</option>
            <option value="Titanium">80 PLUS Titanium</option>
          </select>
        </div>
      </div>
    </div>
    <div class="grid grid-cols-3 gap-0">
      <div class="main-container col-span-3 lg:col-span-2">
        <div class="overflow-x-auto">
          <table class="table-auto w-full text-left">
            <thead class="bg-gray-100">
              <tr>
                <th class="filter p-3">MODELES</th>
                <th>
                  <div class="search-container">
                    <input type="text" id="searchBar" class="search-bar" placeholder="Rechercher...">
                    <span class="search-icon">🔍</span>
                  </div>
                </th>
                <th class="filter p-3 cursor-pointer">NOTE</th>
                <th class="filter p-3 cursor-pointer">PRIX</th>
                <th class="filter p-3 cursor-pointer">DISPONIBILITÉ</th>
              </tr>
            </thead>
            <tbody class="scrollable-products">
              <!-- Les alims seront ajoutées ici-->
            </tbody>
          </table>
        </div>
      </div>
      <div class="col-span-3 lg:col-span-1">
        <div>
          <a href="/Website Beta/Page principale/Configurateur PC.html" class="close-button">X</a>
        </div>
        <div>
          <img src="#" alt="" class="rounded-lg w-full">
        </div>
        <div class="mt-4">
          <h2 class="font-bold text-lg"></h2>
          <p class="text-gray-600 text-sm mt-2"></p>
        </div>
        <div class="p-4 text-right">
          <button id="validateButton" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
            <a href="/Website Beta/Page principale/Configurateur PC.html">VALIDER</a>
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
