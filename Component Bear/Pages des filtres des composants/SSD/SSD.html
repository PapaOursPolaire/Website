<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disque dur SSD</title>
  <link rel="stylesheet" href="SSD.css">
  <script src="SSD.js" defer></script>
  <link rel="icon" href="/Website Beta/Icones/Logo.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <video autoplay muted loop id="backgroundVideo">
    <source src="/Website Beta/VIDEOS/Background.mp4" type="video/mp4">
  </video>
</head>
<body class="bg-gray-100 font-sans">
  <div class="mx-auto" style="max-width: 1600px;">
    <div class="title-filters-container">
      <div class="p-4 border-b">
        <div class="tower-header">
          <h1 class="tower-title">Disque dur SSD</h1>
          <span id="productCount" class="alimentation-count">(0)</span>
        </div>
        <div class="grid grid-cols-3 gap-4">
          <select id="brandFilter" class="border p-2 rounded">
            <option value="" disabled selected hidden>Marques</option>
            <option value="">Toutes les marques</option>
            <option value="Corsair">Corsair</option>
            <option value="Crucial">Crucial</option>
            <option value="Kingston">Kingston</option>
            <option value="Samsung">Samsung</option>
            <option value="WDB">Western Digital</option>
          </select>
          <select id="PCIFilter" class="border p-2 rounded">
            <option value="" disabled selected hidden>Interface avec l'ordinateur</option>
            <option value="">Toutes les interfaces</option>
            <option value="3.4">M.2 - PCI-E 3.0 4x</option>
            <option value="4.4">M.2 - PCI-E 4.0 4x</option>
            <option value="5.2">M.2 - PCI-E 5.0 2x</option>
            <option value="5.4">M.2 - PCI-E 5.0 4x</option>
            <option value="SATA">M.2 - SATA 6Gb/s</option>
            <option value="mSATA">mSATA 6Gb/s (mini-SATA)</option>
            <option value="ATA">Serial ATA 6Gb/s (SATA Revision 3)</option>
          </select>
          <select id="GOFilter" class="border p-2 rounded">
            <option value="" disabled selected hidden>Capacité (en Go)</option>
            <option value="">Toutes les capacités</option>
            <option value="240">240 Go</option>
            <option value="250">250 Go</option>
            <option value="256">256 Go</option>
            <option value="480">480 Go</option>
            <option value="500">500 Go</option>
            <option value="512">512 Go</option>
            <option value="960">960 Go</option>
            <option value="1000">1000 Go (1 To)</option>
            <option value="2000">2000 Go (2 To)</option>
            <option value="4000">4000 Go (4 To)</option>
            <option value="8000">8000 Go (8 To)</option>
          </select>
        </div>
      </div>
    </div>
    <div class="grid grid-cols-3 gap-0">
      <div class="main-container col-span-3 lg:col-span-2">
        <div class="overflow-x-auto">
          <table class="table-auto w-full text-left">
            <thead class="bg-gray-100">
              <tr>
                <th class="filter p-3">MODELES</th>
                <th>
                  <div class="search-container">
                    <input type="text" id="searchBar" class="search-bar" placeholder="Rechercher...">
                    <span class="search-icon">🔍</span>
                  </div>
                </th>
                <th class="filter p-3 cursor-pointer">NOTE</th>
                <th class="filter p-3 cursor-pointer">PRIX</th>
                <th class="filter p-3 cursor-pointer">DISPONIBILITÉ</th>
              </tr>
            </thead>
            <tbody class="scrollable-products">
              <!-- Les SSD seront ajoutés ici-->
            </tbody>
          </table>
        </div>
      </div>
      <div class="col-span-3 lg:col-span-1">
        <div>
          <a href="/Website Beta/Page principale/Configurateur PC.html" class="close-button">X</a>
        </div>
        <div>
          <img src="#" alt="" class="rounded-lg w-full">
        </div>
        <div class="mt-4">
          <h2 class="font-bold text-lg"></h2>
          <p class="text-gray-600 text-sm mt-2"></p>
        </div>
        <div class="p-4 text-right">
          <button id="validateButton" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
            <a href="/Website Beta/Page principale/Configurateur PC.html">VALIDER</a>
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
