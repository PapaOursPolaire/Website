<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BoÎtier</title>
  <link rel="stylesheet" href="BoÎtier.css">
  <script src="BoÎtier.js" defer></script>
  <link rel="icon" href="/Website Beta/Icones/Logo.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <video autoplay muted loop id="backgroundVideo">
    <source src="/Website Beta/VIDEOS/Background.mp4" type="video/mp4">
  </video>
</head>
<body class="bg-gray-100 font-sans">
  <div class="mx-auto" style="max-width: 1600px;">
    <div class="title-filters-container">
      <div class="p-4 border-b">
        <div class="tower-header">
          <h1 class="tower-title">Boîtier</h1>
          <span id="productCount" class="alimentation-count">(0)</span>
        </div>
        <div class="grid grid-cols-3 gap-4">
          <select id="brandFilter" class="border p-2 rounded">
            <option value="" disabled selected hidden>Marques</option>
            <option value="">Toutes les marques</option>
            <option value="AC">AeroCool</option>
            <option value="Antec">Antec</option>
            <option value="ASUS">ASUS</option>
            <option value="be quiet !">be quiet !</option>
            <option value="Cooler Master">Cooler Master</option>
            <option value="Corsair">Corsair</option>
            <option value="DeepCool">DeepCool</option>
            <option value="Lian Li">Lian Li</option>
            <option value="MSI">MSI</option>
            <option value="NZXT">NZXT</option>
            <option value="Phanteks">Phanteks</option>
            <option value="Xigmatek">Xigmatek</option>
          </select>
          <select id="ATXFilter" class="border p-2 rounded">
            <option value="" disabled selected hidden>Format du boitier</option>
            <option value="">Tous les formats</option>
            <option value="Micro">Micro-ATX</option>
            <option value="ATX">ATX</option>
            <option value="E-ATX">E-ATX</option>
            <option value="Mini">Mini-ITX</option>
          </select>
          <select id="COLORFilter" class="border p-2 rounded">
            <option value="" disabled selected hidden>Couleur</option>
            <option value="">Toutes les couleurs</option>
            <option value="Noir">Noir</option>
            <option value="Blanc">Blanc</option>
            <option value="Bleu">Bleu</option>
            <option value="Shrek">Shrek</option>
          </select>
        </div>
      </div>
    </div>
    <div class="grid grid-cols-3 gap-0">
      <div class="main-container col-span-3 lg:col-span-2">
        <div class="overflow-x-auto">
          <table class="table-auto w-full text-left">
            <thead class="bg-gray-100">
              <tr>
                <th class="filter p-3">MODELES</th>
                <th>
                  <div class="search-container">
                    <input type="text" id="searchBar" class="search-bar" placeholder="Rechercher...">
                    <span class="search-icon">🔍</span>
                  </div>
                </th>
                <th class="filter p-3 cursor-pointer">NOTE</th>
                <th class="filter p-3 cursor-pointer">PRIX</th>
                <th class="filter p-3 cursor-pointer">DISPONIBILITÉ</th>
              </tr>
            </thead>
            <tbody class="scrollable-products">
              <!-- Les boÎtiers seront ajoutés ici-->
            </tbody>
          </table>
        </div>
      </div>
      <div class="col-span-3 lg:col-span-1">
        <div>
          <a href="/Website Beta/Page des composants/Composants.html" class="close-button">X</a>
        </div>
        <div>
          <img src="#" alt="" class="rounded-lg w-full">
        </div>
        <div class="mt-4">
          <h2 class="font-bold text-lg"></h2>
          <p class="text-gray-600 text-sm mt-2"></p>
        </div>
        <div class="p-4 text-right">
          <button id="validateButton" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
            <a href="/Website Beta/Page du panier/Panier.html">VALIDER</a>
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
