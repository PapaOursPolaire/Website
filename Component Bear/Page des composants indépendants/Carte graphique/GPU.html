<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carte graphique</title>
  <link rel="stylesheet" href="GPU.css">
  <script src="GPU.js" defer></script>
  <link rel="icon" href="G:\Website Beta\IMAGES\Image complémentaires\Logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <video autoplay muted loop id="backgroundVideo">
    <source src="/Website Beta/VIDEOS/Background.mp4" type="video/mp4">
  </video>
</head>
<body class="bg-gray-100 font-sans">
  <div class="mx-auto" style="max-width: 1600px;">
    <div class="title-filters-container">
      <div class="p-4 border-b">
        <div class="tower-header">
          <h1 class="tower-title">Carte Graphique</h1>
          <span id="productCount" class="alimentation-count">(0)</span>
        </div>
        <div class="grid grid-cols-3 gap-4">
          <select id="brandFilter" class="border p-2 rounded">
            <option value="" disabled selected hidden>Marques</option>
            <option value="">Toutes les marques</option>
            <option value="ASRock">ASRock</option>
            <option value="ASUS">ASUS</option>
            <option value="Gigabyte">GIGABYTE</option>
            <option value="MSI">MSI</option>
            <option value="Sapphire">Sapphire</option>
          </select>
          <select id="chipsetFilter" class="border p-2 rounded">
            <option value="" disabled selected hidden>Chipset graphique</option>
            <option value="">Tous les chipsets</option>
            <option value="arc-a750">Intel Arc A750</option>
            <option value="arc-a770">Intel Arc A770</option>
            <option value="radeon-rx-7600">AMD Radeon RX 7600</option>
            <option value="radeon-rx-7700-xt">AMD Radeon RX 7700 XT</option>
            <option value="radeon-rx-7800-xt">AMD Radeon RX 7800 XT</option>
            <option value="radeon-rx-7900-xt">AMD Radeon RX 7900 XT</option>
            <option value="radeon-rx-7900-xtx">AMD Radeon RX 7900 XTX</option>
            <option value="rtx-3060">NVIDIA GeForce RTX 3060</option>
            <option value="rtx-3070">NVIDIA GeForce RTX 3070</option>
            <option value="rtx-3080">NVIDIA GeForce RTX 3080</option>
            <option value="rtx-3090">NVIDIA GeForce RTX 3090</option>
            <option value="rtx-4060">NVIDIA GeForce RTX 4060</option>
            <option value="rtx-4070">NVIDIA GeForce RTX 4070</option>
            <option value="rtx-4080">NVIDIA GeForce RTX 4080</option>
            <option value="rtx-4090">NVIDIA GeForce RTX 4090</option>
          </select>
          <select id="GDDRFilter" class="border p-2 rounded">
            <option value="" disabled selected hidden>Taille mémoire vidéo (en Go)</option>
            <option value="">Toutes les tailles</option>
            <option value="2">2</option>
            <option value="4">4</option>
            <option value="6">6</option>
            <option value="8">8</option>
            <option value="10">10</option>
            <option value="12">12</option>
            <option value="16">16</option>
            <option value="20">20</option>
            <option value="24">24</option>
            <option value="32">32</option>
            <option value="48">48</option>
          </select>
        </div>
      </div>
    </div>
    <div class="grid grid-cols-3 gap-0">
      <div class="main-container col-span-3 lg:col-span-2">
        <div class="overflow-x-auto">
          <table class="table-auto w-full text-left">
            <thead class="bg-gray-100">
              <tr>
                <th class="filter p-3">MODELES</th>
                <th>
                  <div class="search-container">
                    <input type="text" id="searchBar" class="search-bar" placeholder="Rechercher...">
                    <span class="search-icon">🔍</span>
                  </div>
                </th>
                <th class="filter p-3 cursor-pointer">NOTE</th>
                <th class="filter p-3 cursor-pointer">PRIX</th>
                <th class="filter p-3 cursor-pointer">DISPONIBILITÉ</th>
              </tr>
            </thead>
            <tbody class="scrollable-products">
            </tbody>
          </table>
        </div>
      </div>
      <div class="col-span-3 lg:col-span-1">
        <div>
          <a href="/Website Beta/Page des composants/Composants.html" class="close-button">X</a>
        </div>
        <div>
          <img src="#" alt="" class="rounded-lg w-full">
        </div>
        <div class="mt-4">
          <h2 class="font-bold text-lg"></h2>
          <p class="text-gray-600 text-sm mt-2"></p>
        </div>
        <div class="p-4 text-right">
          <button id="validateButton" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
            <a href="/Website Beta/Page du panier/Panier.html">VALIDER</a>
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
