<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mémoire vive (RAM)</title>
  <link rel="stylesheet" href="RAM.css">
  <script src="RAM.js" defer></script>
  <link rel="icon" href="/Website Beta/Icones/Logo.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <video autoplay muted loop id="backgroundVideo">
    <source src="/Website Beta/VIDEOS/Background.mp4" type="video/mp4">
  </video>
</head>
<body class="bg-gray-100 font-sans">
  <div class="mx-auto" style="max-width: 1600px;">
    <div class="title-filters-container">
      <div class="p-4 border-b">
        <div class="tower-header">
          <h1 class="tower-title">Mémoire vive (RAM)</h1>
          <span id="productCount" class="alimentation-count">(0)</span>
        </div>
        <div class="grid grid-cols-3 gap-4">
          <select id="brandFilter" class="border p-2 rounded">
            <option value="" disabled selected hidden>Marques</option>
            <option value="">Toutes les marques</option>
            <option value="Corsair">Corsair</option>
            <option value="G.Skill">G.Skill</option>
            <option value="Kingston">Kingston</option>
          </select>
          <select id="DDRFilter" class="border p-2 rounded">
            <option value="" disabled selected hidden>Frequences mémoires</option>
            <option value="">Toutes les fréquences</option>
            <option value="DDR4-2133">DDR4-2133</option>
            <option value="DDR4-2400">DDR4-2400</option>
            <option value="DDR4-2666">DDR4-2666</option>
            <option value="DDR4-2933">DDR4-2933</option>
            <option value="DDR4-3200">DDR4-3200</option>
            <option value="DDR4-3600">DDR4-3600</option>
            <option value="DDR4-4000">DDR4-4000</option>
            <option value="DDR4-4400">DDR4-4400</option>
            <option value="DDR4-4800">DDR4-4800</option>
            <option value="DDR5-4800">DDR5-4800</option>
            <option value="DDR5-5200">DDR5-5200</option>
            <option value="DDR5-5600">DDR5-5600</option>
            <option value="DDR5-6000">DDR5-6000</option>
            <option value="DDR5-6400">DDR5-6400</option>
            <option value="DDR5-6800">DDR5-6800</option>
            <option value="DDR5-7200">DDR5-7200</option>
            <option value="DDR5-7600">DDR5-7600</option>
            <option value="DDR5-8000">DDR5-8000</option>
          </select>
          <select id="GOFilter" class="border p-2 rounded">
            <option value="" disabled selected hidden>Capacité (en Go)</option>
            <option value="">Toutes les capacités</option>
            <option value="8">8</option>
            <option value="16">16</option>
            <option value="24">24</option>
            <option value="32">32</option>
            <option value="48">48</option>
            <option value="64">64</option>
            <option value="96">96</option>
            <option value="128">128</option>
            <option value="192">192</option>
          </select>
        </div>
      </div>
    </div>
    <div class="grid grid-cols-3 gap-0">
      <div class="main-container col-span-3 lg:col-span-2">
        <div class="overflow-x-auto">
          <table class="table-auto w-full text-left">
            <thead class="bg-gray-100">
              <tr>
                <th class="filter p-3">MODELES</th>
                <th>
                  <div class="search-container">
                    <input type="text" id="searchBar" class="search-bar" placeholder="Rechercher...">
                    <span class="search-icon">🔍</span>
                  </div>
                </th>
                <th class="filter p-3 cursor-pointer">NOTE</th>
                <th class="filter p-3 cursor-pointer">PRIX</th>
                <th class="filter p-3 cursor-pointer">DISPONIBILITÉ</th>
              </tr>
            </thead>
            <tbody class="scrollable-products">
              <!-- Les RAM seront ajoutées ici-->
            </tbody>           
          </table>
        </div>
      </div>
      <div class="col-span-3 lg:col-span-1">
        <div>
          <a href="/Website Beta/Page des composants/Composants.html" class="close-button">X</a>
        </div>
        <div>
          <img src="#" alt="" class="rounded-lg w-full">
        </div>
        <div class="mt-4">
          <h2 class="font-bold text-lg"></h2>
          <p class="text-gray-600 text-sm mt-2"></p>
        </div>
        <div class="p-4 text-right">
          <button id="validateButton" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
            <a href="/Website Beta/Page du panier/Panier.html">VALIDER</a>
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
