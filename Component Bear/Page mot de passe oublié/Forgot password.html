<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié ?</title>
    <link rel="icon" href="/Website Beta/IMAGES/Image complémentaires/Logo.png">
    <link rel="stylesheet" href="Forgot password.css">
    <link rel="icon" href="/Website Beta/IMAGES/Image complémentaires/Logo site.jpg">
    <video autoplay muted loop id="backgroundVideo">
        <source src="/Website Beta/VIDEOS/Background.mp4" type="video/mp4">
    </video>
</head>
<body>
    <header>
        <div class="logo">
            <a href="/Website Beta/Page principale/Configurateur PC.html" class="logo">
                <img src="/Website Beta/IMAGES/Image complémentaires/Logo.png" alt="header-icon" width="50px">
            </a>
        </div>
        
        <div class="name">
            <p>Component Bear</p>
        </div>

        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Rechercher un produit, une marque, une catégorie...">
            <button onclick="search()">🔍</button>
        </div>

        <div class="icons">
            <div class="picture-icon" style="text-decoration: none;">
                <a href="/Website Beta/Page de connection/connection.html">
                    <img src="/Website Beta/IMAGES/Image complémentaires/Red avatar.png" width="90px" alt="">
                    <p>Compte</p>
                </a>
            </div>
            <div class="picture-icon" style="text-decoration: none;">
                <a href="/Website Beta/Page du panier/Panier.html">
                    <img src="/Website Beta/IMAGES/Image complémentaires/Red panier.png" width="51px" alt="">
                    <p>Panier</p>
                </a>
            </div>
        </div>
    </header>
    <nav>
        <ul>
            <li><a href="/Website Beta/Page principale/Configurateur PC.html">Configurateur PC</a></li>
            <li><a href="/Website Beta/Page des composants/Composants.html">Composants</a></li>
            <li><a href="/Website Beta/Page des périphériques/Périphériques.html">Périphériques</a></li>
            <li><a href="/Website Beta/Page de contact/Contactez-nous.html">Contactez-nous</a></li>
            <li><a href="/Website Beta/Page d'informations sur notre entreprise/QSN.html">Qui sommes-nous ?</a></li>
        </ul>
    </nav>
    <div class="ligne-rgb"></div>
    <form class="forgot-password">
        <div class="header">
          <span style="text-decoration: none;color: #4f46e5;text-align: center;" class="title">Mot de passe oublié ?</span>
          <p class="sub-title">Veuillez saisir une option pour réinitialiser votre mot de passe.</p>
        </div>
        <div class="reset-option">
          <input value="email" id="email" name="option" type="radio" checked="">
          <label for="email">
            <div class="reset-info">
              <span class="reset-title">Réinitialiser par e-mail</span>
              <span class="reset-sub-title">Le lien de réinitialisation sera envoyé à votre adresse e-mail enregistrée</span>
            </div>
          </label>
        </div>
        <br>
        <div class="reset-option">
          <input value="sms" id="sms" name="option" type="radio">
          <label for="sms">
             <div class="reset-info">
              <span class="reset-title">Réinitialiser par SMS</span>
              <span class="reset-sub-title">Le lien de réinitialisation sera envoyé à votre numéro enregistré</span>
            </div>
          </label>
        </div>
          <a href="#" title="" class="send-btn">Envoyer un lien</a>
          <p class="sub-title">Vous n'avez pas reçu le lien ?</p>
          <p><span class="resend"><a href="#" style="text-decoration: none;color: #4f46e5;">Renvoyer</a></span></p>
      </form>
</body>
</html>
