<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disque dur SSD</title>
  <link rel="stylesheet" href="Montage.css">
  <script src="Montage.js" defer></script>
  <link rel="icon" href="/Website Beta/Icones/Logo.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <video autoplay muted loop id="backgroundVideo">
    <source src="/Website Beta/VIDEOS/Background.mp4" type="video/mp4">
  </video>
</head>
<body class="bg-gray-100 font-sans">
  <div class="mx-auto" style="max-width: 1600px;">
    <div class="title-filters-container">
      <div class="p-4 border-b">
        <div class="montage-header">
          <h1 class="montage-title">Montage</h1>
          <span id="productCount" class="alimentation-count">(0)</span>
        </div>
        <div class="grid grid-cols-3 gap-4">
          <select id="MontageFilter" class="border p-2 rounded">
            <option value="" disabled selected hidden>Montage PC</option>
            <option value="">Toutes les sortes de Montage PC</option>
            <option value="Montage">Montage PC sans système d'exploitation</option>
            <option value="Montage11F">Montage PC avec Windows 11 Famille</option>
            <option value="Montage11P">Montage PC avec Windows 11 Pro</option>
            <option value="MontageALA">Montage PC avec license fournie par vos soins</option>
            <option value="MontageLinux">Montage PC avec le Linux de votre choix</option>
          </select>
          <select id="BIOSFilter" class="border p-2 rounded">
            <option value="" disabled selected hidden>Mise à jour du BIOS/UEFI & drivers</option>
            <option value="">Toutes les sortes de Mise à jour du BIOS/ de l'UEFI</option>
            <option value="Premium">Montage PC avec mise à jour des drivers & du BIOS/ de l'UEFI</option>
            <option value="BIOS">Mise à jour du BIOS/ de l'UEFI</option>
            <option value="NON">Pas de mise à jour du BIOS / de l'UEFI</option>
          </select>
          <select id="OSFilter" class="border p-2 rounded">
            <option value="" disabled selected hidden>Système d'exploitation</option>
            <option value="">Toutes les sortes de Système d'exploitation</option>
            <option value="Windows11F">Windows 11 Famille</option>
            <option value="Windows11P">Windows 11 Pro</option>
            <option value="Linux">Linux</option>
            <option value="Sans">Sans système d'exploitation</option>           
          </select>
        </div>
      </div>
    </div>
    <div class="grid grid-cols-3 gap-0">
      <div class="main-container col-span-3 lg:col-span-2">
        <div class="overflow-x-auto">
          <table class="table-auto w-full text-left">
            <thead class="bg-gray-100">
              <tr>
                <th class="filter p-3">MODELES</th>
                <th>
                  <div class="search-container">
                    <input type="text" id="searchBar" class="search-bar" placeholder="Rechercher...">
                    <span class="search-icon">🔍</span>
                  </div>
                </th>
                <th class="filter p-3 cursor-pointer">NOTE</th>
                <th class="filter p-3 cursor-pointer">PRIX</th>
                <th class="filter p-3 cursor-pointer">DISPONIBILITÉ</th>
              </tr>
            </thead>
            <tbody class="scrollable-products">
              <!-- Les options de montage seront ajoutées ici dynamiquement -->
            </tbody>
          </table>
        </div>
      </div>
      <div class="col-span-3 lg:col-span-1">
        <div>
          <a href="/Website Beta/Page principale/Configurateur PC.html" class="close-button">X</a>
        </div>
        <div>
          <img src="#" alt="" class="rounded-lg w-full">
        </div>
        <div class="mt-4">
          <h2 class="font-bold text-lg"></h2>
          <p class="text-gray-600 text-sm mt-2"></p>
        </div>
        <div class="p-4 text-right">
          <button id="validateButton" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
            <a href="/Website Beta/Page principale/Configurateur PC.html">VALIDER</a>
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
